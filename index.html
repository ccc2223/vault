<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1e1e2e">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f7;--bg3:#e9e9ee;--fg:#1f2330;--mute:#6b7080;--accent:#7c5cff;--border:#dcdce3;--danger:#d33;--code:#f0f0f4}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e2e;--bg2:#181825;--bg3:#2a2a3c;--fg:#dcdfee;--mute:#8b90a8;--accent:#a28bff;--border:#33344a;--danger:#ff6b6b;--code:#262637}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input,textarea{font:inherit;color:inherit}
#side{width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#side .top{padding:10px;display:flex;gap:6px}
#q{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
#list{flex:1;overflow:auto;padding:0 6px}
.item{padding:6px 8px;border-radius:6px;cursor:pointer}
.item:hover{background:var(--bg3)}
.item.cur{background:var(--bg3);outline:1px solid var(--accent)}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .f{color:var(--mute);font-size:12px}
.item .s{color:var(--mute);font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item mark{background:rgba(124,92,255,.3);color:inherit;border-radius:2px}
#status{padding:8px 10px;font-size:12px;color:var(--mute);border-top:1px solid var(--border)}
#status.err{color:var(--danger)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#title{flex:1;min-width:80px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#menu{display:none}
#panes{flex:1;display:flex;min-height:0;position:relative}
#ta{flex:1;min-width:0;border:0;outline:0;resize:none;padding:16px;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6}
#pv{flex:1;min-width:0;overflow:auto;padding:16px 22px}
#panes.edit #pv{display:none}
#panes.view #ta{display:none}
#panes.split #ta{border-right:1px solid var(--border)}
#sug{position:absolute;left:16px;bottom:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow:auto;min-width:200px;max-width:80%;display:none;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#sug div{padding:6px 10px;cursor:pointer}
#sug div.sel,#sug div:hover{background:var(--accent);color:#fff}
#bl{border-top:1px solid var(--border);background:var(--bg2);max-height:30%;overflow:auto;padding:6px 12px;font-size:13px}
#bl summary{cursor:pointer;color:var(--mute);font-weight:600}
#bl .b{padding:4px 0;cursor:pointer}
#bl .b .p{color:var(--accent)}
#bl .b .l{color:var(--mute)}
#pv h1,#pv h2,#pv h3{margin:1em 0 .4em;line-height:1.25}
#pv h1:first-child{margin-top:0}
#pv code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
#pv pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
#pv pre code{background:none;padding:0}
#pv blockquote{margin:0;padding:0 14px;border-left:3px solid var(--accent);color:var(--mute)}
#pv table{border-collapse:collapse}
#pv th,#pv td{border:1px solid var(--border);padding:4px 10px}
#pv img{max-width:100%}
#pv a{color:var(--accent)}
#pv a.wikilink{text-decoration:none;border-bottom:1px solid var(--accent);cursor:pointer}
#pv a.wikilink.missing{opacity:.6;border-bottom-style:dashed}
#pv ul:has(input[type=checkbox]){list-style:none;padding-left:4px}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:12px;padding:16px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
dialog input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg2)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog p.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
#qs-list{margin-top:8px;max-height:50vh;overflow:auto}
#qs-list div{padding:7px 9px;border-radius:6px;cursor:pointer}
#qs-list div.sel{background:var(--accent);color:#fff}
#back{display:none}
@media(max-width:800px){
  #side{position:fixed;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:84vw;max-width:320px}
  body.drawer #side{transform:none}
  body.drawer #back{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  #menu{display:inline-block}
  #panes.split #pv{display:none}
  #panes.split #ta{border-right:0}
  #m-split{display:none}
  #bl{max-height:35%}
}
</style>
</head>
<body>
<aside id="side">
  <div class="top">
    <input id="q" type="search" placeholder="Search notes…" autocomplete="off">
    <button id="new" title="New note (Alt+N)">＋</button>
  </div>
  <div id="list"></div>
  <div id="status">Local only</div>
</aside>
<div id="back"></div>
<section id="main">
  <div id="bar">
    <button id="menu" title="Notes">☰</button>
    <div id="title" title="Click to rename"></div>
    <button id="m-edit">Edit</button>
    <button id="m-split">Split</button>
    <button id="m-view">View</button>
    <button id="switch" title="Quick switcher (Ctrl/Cmd+O)">⌕</button>
    <button id="sync" title="Sync (Ctrl/Cmd+S)">⇅</button>
    <button id="del" title="Delete note">🗑</button>
    <button id="cfg" title="Settings">⚙</button>
  </div>
  <div id="panes" class="split">
    <textarea id="ta" spellcheck="false" placeholder="Start writing… use [[Note name]] to link notes."></textarea>
    <div id="pv"></div>
    <div id="sug"></div>
  </div>
  <details id="bl" open><summary id="bl-sum">Backlinks</summary><div id="bl-body"></div></details>
</section>

<dialog id="dlg-cfg">
  <h3 style="margin:0">Sync</h3>
  <div class="row" style="justify-content:flex-start;margin-top:10px"><button id="c-m-s">Password</button><button id="c-m-t">Access token</button></div>
  <div id="c-s">
    <label>Sync server URL</label><input id="c-url" placeholder="https://vault-sync.you.workers.dev" autocomplete="url">
    <label>Password</label><input id="c-pw" type="password" autocomplete="current-password">
    <p class="hint">Your GitHub token stays on the sync server. This device only keeps a sign-in session.</p>
  </div>
  <div id="c-t">
    <label>Repository (owner/name)</label><input id="c-repo" placeholder="you/my-vault">
    <label>Access token</label><input id="c-token" type="password" placeholder="github_pat_…">
    <p class="hint">Direct mode: a fine-grained token limited to the notes repo, Contents: read &amp; write, stored in this browser.</p>
  </div>
  <label>Branch</label><input id="c-branch" placeholder="main">
  <p id="c-err" class="hint"></p>
  <div class="row"><button id="c-clear">Sign out</button><button id="c-cancel">Cancel</button><button id="c-save" class="on">Save &amp; sync</button></div>
</dialog>

<dialog id="dlg-qs">
  <input id="qs-in" placeholder="Jump to note… (Enter to open or create)" autocomplete="off">
  <div id="qs-list"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
'use strict';
// Set this to your sync server (Cloudflare Worker) URL so new devices only need the password.
const SYNC_URL = '';
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baseName = p => p.replace(/^.*\//, '').replace(/\.md$/i, '');

/* ---------- storage (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('vault', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('notes', { keyPath: 'path' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('notes', mode);
      const out = fn(t.objectStore('notes'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    });
  },
  all() { return this.tx('readonly', s => s.getAll()); },
  put(n) { return this.tx('readwrite', s => s.put(n)); },
  del(p) { return this.tx('readwrite', s => s.delete(p)); }
};

/* ---------- state ---------- */
const notes = new Map();   // path -> {path, content, mtime, sha, dirty, deleted}
let cur = null;            // current path
let index = { byPath: new Map(), byBase: new Map() };
const live = () => [...notes.values()].filter(n => !n.deleted);

function rebuildIndex() {
  index = { byPath: new Map(), byBase: new Map() };
  for (const n of live().sort((a, b) => a.path.length - b.path.length)) {
    index.byPath.set(n.path.toLowerCase(), n.path);
    const b = baseName(n.path).toLowerCase();
    if (!index.byBase.has(b)) index.byBase.set(b, n.path);
  }
}
function resolve(target) {
  const t = target.trim().toLowerCase().replace(/\.md$/, '');
  if (t.includes('/')) return index.byPath.get(t + '.md') || index.byBase.get(t.replace(/^.*\//, '')) || null;
  return index.byBase.get(t) || null;
}

/* ---------- markdown ---------- */
marked.use({
  gfm: true, breaks: true,
  extensions: [{
    name: 'wikilink', level: 'inline',
    start(src) { return src.indexOf('[['); },
    tokenizer(src) {
      const m = /^\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/.exec(src);
      if (m) return { type: 'wikilink', raw: m[0], target: m[1].trim(), text: (m[2] || m[1]).trim() };
    },
    renderer(t) {
      const ok = resolve(t.target);
      return `<a class="wikilink${ok ? '' : ' missing'}" data-target="${esc(t.target)}">${esc(t.text)}</a>`;
    }
  }]
});
DOMPurify.addHook('afterSanitizeAttributes', node => {
  if (node.tagName === 'A' && node.getAttribute('href')) {
    node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer');
  }
});
function renderPreview() {
  const n = notes.get(cur);
  $('#pv').innerHTML = n ? DOMPurify.sanitize(marked.parse(n.content)) : '';
}

/* ---------- persistence ---------- */
let saveT = null, syncT = null;
function touch(n) {
  n.mtime = Date.now(); n.dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    await DB.put(n);
    rebuildIndex(); renderBacklinks(); renderList();
    scheduleSync(15000);
  }, 400);
}
async function flush() {
  clearTimeout(saveT);
  const n = notes.get(cur);
  if (n) await DB.put(n);
}

/* ---------- UI: list / search ---------- */
function snippet(content, tokens) {
  const low = content.toLowerCase();
  let i = -1;
  for (const t of tokens) { i = low.indexOf(t); if (i >= 0) break; }
  if (i < 0) return '';
  const s = content.slice(Math.max(0, i - 30), i + 90).replace(/\s+/g, ' ');
  let h = esc(s);
  for (const t of tokens) h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  return h;
}
function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const tokens = q.split(/\s+/).filter(Boolean);
  let arr = live();
  const snips = new Map();
  if (tokens.length) {
    arr = arr.filter(n => {
      const hay = (n.path + '\n' + n.content).toLowerCase();
      return tokens.every(t => hay.includes(t));
    });
    arr.sort((a, b) => {
      const sa = tokens.every(t => baseName(a.path).toLowerCase().includes(t)) ? 0 : 1;
      const sb = tokens.every(t => baseName(b.path).toLowerCase().includes(t)) ? 0 : 1;
      return sa - sb || b.mtime - a.mtime;
    });
    arr = arr.slice(0, 100);
    arr.forEach(n => snips.set(n.path, snippet(n.content, tokens)));
  } else {
    arr.sort((a, b) => a.path.localeCompare(b.path));
  }
  $('#list').innerHTML = arr.map(n => {
    const folder = n.path.includes('/') ? n.path.replace(/\/[^/]*$/, '') : '';
    return `<div class="item${n.path === cur ? ' cur' : ''}" data-p="${esc(n.path)}">
      <div class="t">${esc(baseName(n.path))}${n.dirty ? ' •' : ''}</div>
      ${folder ? `<div class="f">${esc(folder)}</div>` : ''}
      ${snips.get(n.path) ? `<div class="s">${snips.get(n.path)}</div>` : ''}</div>`;
  }).join('') || '<div class="item" style="color:var(--mute)">No notes</div>';
}

/* ---------- backlinks ---------- */
function renderBacklinks() {
  const out = [];
  if (cur) {
    for (const n of live()) {
      if (n.path === cur) continue;
      const lines = n.content.split('\n');
      for (const line of lines) {
        const re = /\[\[([^\]|#]+)/g; let m;
        while ((m = re.exec(line))) {
          if (resolve(m[1]) === cur) { out.push({ path: n.path, line: line.trim().slice(0, 140) }); break; }
        }
      }
    }
  }
  $('#bl-sum').textContent = `Backlinks (${out.length})`;
  $('#bl-body').innerHTML = out.map(b =>
    `<div class="b" data-p="${esc(b.path)}"><span class="p">${esc(baseName(b.path))}</span> <span class="l">— ${esc(b.line)}</span></div>`
  ).join('') || '<div style="color:var(--mute);padding:4px 0">No notes link here yet.</div>';
}

/* ---------- open / create / rename / delete ---------- */
async function openNote(path) {
  await flush();
  if (!notes.has(path) || notes.get(path).deleted) return;
  cur = path;
  localStorage.setItem('vault.last', path);
  $('#ta').value = notes.get(path).content;
  $('#title').textContent = baseName(path);
  document.title = baseName(path) + ' – Vault';
  renderPreview(); renderBacklinks(); renderList();
  document.body.classList.remove('drawer');
}
function normPath(name) {
  let p = name.trim().replace(/\\/g, '/').replace(/^\/+/, '').replace(/\/+/g, '/');
  p = p.split('/').map(s => s.replace(/[<>:"|?*]/g, '').trim()).filter(Boolean).join('/');
  if (!p) return null;
  return /\.md$/i.test(p) ? p : p + '.md';
}
async function createNote(name, content = '') {
  const p = normPath(name); if (!p) return null;
  const ex = [...notes.values()].find(n => n.path.toLowerCase() === p.toLowerCase());
  if (ex && !ex.deleted) { await openNote(ex.path); return ex.path; }
  if (ex && ex.deleted) { notes.delete(ex.path); await DB.del(ex.path); }
  const n = { path: p, content: content || `# ${baseName(p)}\n\n`, mtime: Date.now(), sha: null, dirty: true };
  notes.set(p, n); await DB.put(n);
  rebuildIndex(); await openNote(p);
  const ta = $('#ta'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  scheduleSync(15000);
  return p;
}
async function renameNote() {
  const n = notes.get(cur); if (!n) return;
  const to = prompt('Rename note (use folder/name to move):', n.path.replace(/\.md$/i, ''));
  if (!to) return;
  const p = normPath(to);
  if (!p || p === n.path) return;
  if ([...notes.values()].some(x => !x.deleted && x.path.toLowerCase() === p.toLowerCase())) { alert('A note with that name already exists.'); return; }
  await flush();
  const old = n.path, oldBase = baseName(old);
  // old path: tombstone if it was synced, otherwise drop
  if (n.sha) { n.deleted = true; await DB.put(n); } else { notes.delete(old); await DB.del(old); }
  const nn = { path: p, content: n.content, mtime: Date.now(), sha: null, dirty: true };
  notes.set(p, nn); await DB.put(nn);
  // update links in other notes if the base name changed
  const newBase = baseName(p);
  if (oldBase.toLowerCase() !== newBase.toLowerCase()) {
    const re = new RegExp('\\[\\[' + oldBase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=[\\]|#])', 'gi');
    for (const o of live()) {
      if (re.test(o.content)) { o.content = o.content.replace(re, '[[' + newBase); o.mtime = Date.now(); o.dirty = true; await DB.put(o); }
      re.lastIndex = 0;
    }
  }
  rebuildIndex(); cur = null; await openNote(p); scheduleSync(15000);
}
async function deleteNote() {
  const n = notes.get(cur); if (!n) return;
  if (!confirm(`Delete "${baseName(n.path)}"?`)) return;
  clearTimeout(saveT);
  if (n.sha) { n.deleted = true; await DB.put(n); } else { notes.delete(n.path); await DB.del(n.path); }
  rebuildIndex(); cur = null;
  const next = live().sort((a, b) => b.mtime - a.mtime)[0];
  if (next) await openNote(next.path); else await createNote('Untitled');
  scheduleSync(15000);
}

/* ---------- editor ---------- */
const ta = $('#ta');
let rpT = null;
ta.addEventListener('input', () => {
  const n = notes.get(cur); if (!n) return;
  n.content = ta.value; touch(n);
  clearTimeout(rpT); rpT = setTimeout(renderPreview, 150);
  updateSug();
});
$('#pv').addEventListener('click', async e => {
  const a = e.target.closest('a.wikilink'); if (!a) return;
  e.preventDefault();
  const t = a.dataset.target, p = resolve(t);
  if (p) await openNote(p); else await createNote(t);
});
$('#list').addEventListener('click', e => { const i = e.target.closest('.item[data-p]'); if (i) openNote(i.dataset.p); });
$('#bl-body').addEventListener('click', e => { const i = e.target.closest('.b[data-p]'); if (i) openNote(i.dataset.p); });
$('#q').addEventListener('input', renderList);

/* [[ autocomplete */
let sugItems = [], sugSel = 0, sugStart = -1;
function updateSug() {
  const pos = ta.selectionStart, before = ta.value.slice(0, pos);
  const m = /\[\[([^\]\n|]*)$/.exec(before);
  const box = $('#sug');
  if (!m) { box.style.display = 'none'; sugItems = []; return; }
  sugStart = pos - m[1].length - 2;
  const q = m[1].toLowerCase();
  sugItems = live().filter(n => baseName(n.path).toLowerCase().includes(q) && n.path !== cur)
    .sort((a, b) => b.mtime - a.mtime).slice(0, 8).map(n => baseName(n.path));
  if (!sugItems.length) { box.style.display = 'none'; return; }
  sugSel = 0; drawSug(); box.style.display = 'block';
}
function drawSug() {
  $('#sug').innerHTML = sugItems.map((s, i) => `<div class="${i === sugSel ? 'sel' : ''}" data-i="${i}">${esc(s)}</div>`).join('');
}
function pickSug(i) {
  const name = sugItems[i]; if (name == null) return;
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, sugStart) + '[[' + name + ']]' + ta.value.slice(pos);
  const np = sugStart + name.length + 4;
  ta.setSelectionRange(np, np);
  $('#sug').style.display = 'none'; sugItems = [];
  ta.dispatchEvent(new Event('input'));
  $('#sug').style.display = 'none';
}
$('#sug').addEventListener('mousedown', e => { e.preventDefault(); const d = e.target.closest('div[data-i]'); if (d) pickSug(+d.dataset.i); });
ta.addEventListener('keydown', e => {
  const open = $('#sug').style.display === 'block' && sugItems.length;
  if (open) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sugSel = (sugSel + 1) % sugItems.length; drawSug(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); sugSel = (sugSel - 1 + sugItems.length) % sugItems.length; drawSug(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickSug(sugSel); return; }
    if (e.key === 'Escape') { $('#sug').style.display = 'none'; return; }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
    ta.setSelectionRange(s + 2, s + 2);
    ta.dispatchEvent(new Event('input'));
  }
});
ta.addEventListener('blur', () => setTimeout(() => { $('#sug').style.display = 'none'; }, 150));

/* ---------- modes ---------- */
function setMode(m) {
  $('#panes').className = m;
  for (const k of ['edit', 'split', 'view']) $('#m-' + k).classList.toggle('on', k === m);
  localStorage.setItem('vault.mode', m);
  if (m !== 'edit') renderPreview();
}
$('#m-edit').onclick = () => setMode('edit');
$('#m-split').onclick = () => setMode('split');
$('#m-view').onclick = () => setMode('view');

/* ---------- quick switcher ---------- */
let qsSel = 0, qsRes = [];
function fuzzy(name, q) {
  name = name.toLowerCase();
  const i = name.indexOf(q);
  if (i >= 0) return 1000 - i - name.length * 0.01;
  let j = 0;
  for (const c of name) if (c === q[j]) j++;
  return j === q.length ? 10 : 0;
}
function drawQs() {
  const q = $('#qs-in').value.trim().toLowerCase();
  qsRes = q
    ? live().map(n => ({ n, s: fuzzy(baseName(n.path), q) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s || b.n.mtime - a.n.mtime).slice(0, 12).map(x => ({ path: x.n.path }))
    : live().sort((a, b) => b.mtime - a.mtime).slice(0, 12).map(n => ({ path: n.path }));
  if (q && !qsRes.some(r => baseName(r.path).toLowerCase() === q)) qsRes.push({ create: $('#qs-in').value.trim() });
  qsSel = Math.min(qsSel, qsRes.length - 1);
  $('#qs-list').innerHTML = qsRes.map((r, i) =>
    `<div class="${i === qsSel ? 'sel' : ''}" data-i="${i}">${r.create != null ? `Create “${esc(r.create)}”` : esc(r.path.replace(/\.md$/i, ''))}</div>`).join('');
}
async function qsGo(i) {
  const r = qsRes[i]; if (!r) return;
  $('#dlg-qs').close();
  if (r.create != null) await createNote(r.create); else await openNote(r.path);
}
function openSwitcher() {
  $('#qs-in').value = ''; qsSel = 0; drawQs(); $('#dlg-qs').showModal(); $('#qs-in').focus();
}
$('#qs-in').addEventListener('input', () => { qsSel = 0; drawQs(); });
$('#qs-in').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); qsSel = Math.min(qsSel + 1, qsRes.length - 1); drawQs(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); qsSel = Math.max(qsSel - 1, 0); drawQs(); }
  else if (e.key === 'Enter') { e.preventDefault(); qsGo(qsSel); }
});
$('#qs-list').addEventListener('click', e => { const d = e.target.closest('div[data-i]'); if (d) qsGo(+d.dataset.i); });
$('#dlg-qs').addEventListener('click', e => { if (e.target === $('#dlg-qs')) $('#dlg-qs').close(); });

/* ---------- GitHub sync ---------- */
const getCfg = () => { try { return JSON.parse(localStorage.getItem('vault.gh')); } catch { return null; } };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const b64e = s => { const b = new TextEncoder().encode(s); let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
const b64d = s => { const bin = atob(s.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };
async function gh(path, opts = {}) {
  const c = getCfg();
  const viaServer = !!c.url;
  const base = viaServer ? c.url.replace(/\/+$/, '') + '/gh' : 'https://api.github.com/repos/' + c.repo;
  const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + (viaServer ? c.session : c.token) };
  if (opts.body) headers['Content-Type'] = 'application/json';
  if (!viaServer) headers['X-GitHub-Api-Version'] = '2022-11-28';
  const r = await fetch(base + path, { ...opts, headers, cache: 'no-store' });
  if (!r.ok) {
    let msg = ''; try { msg = (await r.json()).message; } catch {}
    if (r.status === 401 && viaServer) msg = 'signed out, sign in again in ⚙';
    throw new Error(r.status + (msg ? ' ' + msg : ''));
  }
  return r.json();
}
function setStatus(t, err) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!err); }
function scheduleSync(ms) { if (!getCfg()) return; clearTimeout(syncT); syncT = setTimeout(sync, ms); }
let syncing = false;
async function sync() {
  const c = getCfg();
  if (!c) { setStatus('Local only — set up sync in ⚙'); return; }
  if (syncing) return;
  syncing = true; clearTimeout(syncT); setStatus('Syncing…');
  try {
    await flush();
    const tree = await gh('/git/trees/' + encodeURIComponent(c.branch || 'main') + '?recursive=1');
    const remote = new Map(tree.tree
      .filter(t => t.type === 'blob' && /\.md$/i.test(t.path) && !t.path.split('/').some(s => s.startsWith('.')))
      .map(t => [t.path, t.sha]));
    const today = new Date().toISOString().slice(0, 10);

    // pull
    for (const [p, sha] of remote) {
      const l = notes.get(p);
      if (l && l.deleted) continue;
      if (l && l.sha === sha) continue;
      const blob = await gh('/git/blobs/' + sha);
      const text = b64d(blob.content);
      if (!l) {
        const n = { path: p, content: text, mtime: Date.now(), sha, dirty: false };
        notes.set(p, n); await DB.put(n);
      } else if (!l.dirty) {
        l.content = text; l.sha = sha; l.mtime = Date.now(); await DB.put(l);
      } else if (l.content !== text) {
        const cp = p.replace(/\.md$/i, '') + ` (conflict ${today}).md`;
        if (!notes.has(cp)) { const n = { path: cp, content: text, mtime: Date.now(), sha: null, dirty: true }; notes.set(cp, n); await DB.put(n); }
        l.sha = sha; await DB.put(l);
      } else { l.sha = sha; l.dirty = false; await DB.put(l); }
    }
    // remote deletions
    for (const l of [...notes.values()]) {
      if (remote.has(l.path) || l.deleted) continue;
      if (l.sha && !l.dirty) { notes.delete(l.path); await DB.del(l.path); }
      else if (l.sha) { l.sha = null; await DB.put(l); }
    }
    // push
    let pushed = 0;
    for (const l of [...notes.values()]) {
      if (l.deleted) {
        if (remote.has(l.path)) {
          await gh('/contents/' + encPath(l.path), { method: 'DELETE', body: JSON.stringify({ message: 'Delete ' + l.path, sha: remote.get(l.path), branch: c.branch || 'main' }) });
          pushed++;
        }
        notes.delete(l.path); await DB.del(l.path); continue;
      }
      if (l.dirty || !l.sha) {
        const sent = l.content;
        const body = { message: 'Update ' + l.path, content: b64e(sent), branch: c.branch || 'main' };
        if (l.sha) body.sha = l.sha;
        const res = await gh('/contents/' + encPath(l.path), { method: 'PUT', body: JSON.stringify(body) });
        l.sha = res.content.sha; l.dirty = l.content !== sent; await DB.put(l); pushed++;
      }
    }
    rebuildIndex();
    if (!cur || !notes.has(cur) || notes.get(cur).deleted) {
      const next = live().sort((a, b) => b.mtime - a.mtime)[0];
      cur = null; if (next) await openNote(next.path);
    } else if (document.activeElement !== ta && ta.value !== notes.get(cur).content) {
      ta.value = notes.get(cur).content; renderPreview();
    }
    renderList(); renderBacklinks();
    setStatus('Synced ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + (pushed ? ` · pushed ${pushed}` : ''));
  } catch (e) {
    setStatus('Sync failed: ' + e.message, true);
  } finally { syncing = false; }
}

/* settings dialog */
let cfgMode = 'server';
function setCfgMode(m) {
  cfgMode = m;
  $('#c-s').style.display = m === 'server' ? '' : 'none';
  $('#c-t').style.display = m === 'token' ? '' : 'none';
  $('#c-m-s').classList.toggle('on', m === 'server');
  $('#c-m-t').classList.toggle('on', m === 'token');
}
$('#c-m-s').onclick = () => setCfgMode('server');
$('#c-m-t').onclick = () => setCfgMode('token');
$('#cfg').onclick = () => {
  const c = getCfg() || {};
  $('#c-url').value = c.url || localStorage.getItem('vault.url') || SYNC_URL;
  $('#c-pw').value = '';
  $('#c-pw').placeholder = c.session ? 'Signed in (enter to sign in again)' : '';
  $('#c-repo').value = c.repo || ''; $('#c-token').value = c.token || '';
  $('#c-branch').value = c.branch || 'main';
  $('#c-err').textContent = '';
  setCfgMode(c.token ? 'token' : 'server');
  $('#dlg-cfg').showModal();
};
$('#c-cancel').onclick = () => $('#dlg-cfg').close();
$('#c-clear').onclick = () => { localStorage.removeItem('vault.gh'); $('#dlg-cfg').close(); setStatus('Local only — set up sync in ⚙'); };
$('#c-save').onclick = async () => {
  const branch = $('#c-branch').value.trim() || 'main';
  const say = t => { $('#c-err').textContent = t; };
  if (cfgMode === 'server') {
    const url = $('#c-url').value.trim().replace(/\/+$/, '');
    const pw = $('#c-pw').value;
    const old = getCfg();
    if (!/^https:\/\/[^/\s]+/.test(url)) { say('Enter the sync server URL (https://…).'); return; }
    if (!pw) {
      if (old && old.url === url && old.session) {
        localStorage.setItem('vault.gh', JSON.stringify({ ...old, branch }));
        $('#dlg-cfg').close(); sync(); return;
      }
      say('Enter your password.'); return;
    }
    $('#c-save').disabled = true; say('Signing in…');
    try {
      const r = await fetch(url + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.session) { say(j.message || ('Sign-in failed (' + r.status + ')')); return; }
      localStorage.setItem('vault.gh', JSON.stringify({ url, session: j.session, branch }));
      localStorage.setItem('vault.url', url);
      $('#dlg-cfg').close(); sync();
    } catch { say('Could not reach the sync server. Check the URL.'); }
    finally { $('#c-save').disabled = false; }
  } else {
    const repo = $('#c-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '');
    const token = $('#c-token').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { say('Enter repository as owner/name and an access token.'); return; }
    localStorage.setItem('vault.gh', JSON.stringify({ repo, branch, token }));
    $('#dlg-cfg').close(); sync();
  }
};

/* ---------- toolbar / shortcuts ---------- */
$('#new').onclick = () => { const n = prompt('New note name (use folder/name for folders):'); if (n) createNote(n); };
$('#title').onclick = renameNote;
$('#del').onclick = deleteNote;
$('#sync').onclick = sync;
$('#switch').onclick = openSwitcher;
$('#menu').onclick = () => document.body.classList.toggle('drawer');
$('#back').onclick = () => document.body.classList.remove('drawer');
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openSwitcher(); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); sync(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); document.body.classList.add('drawer'); $('#q').focus(); }
  else if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); setMode($('#panes').className === 'edit' ? 'view' : 'edit'); }
  else if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); $('#new').click(); }
});
window.addEventListener('beforeunload', () => { const n = notes.get(cur); if (n && n.dirty) DB.put(n); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else if (getCfg()) sync(); });

/* ---------- init ---------- */
const WELCOME = `# Welcome to Vault

Your notes are plain markdown files, stored in this browser and synced to your own private GitHub repo.

- Link notes with [[wikilinks]] — try [[Example Note]] (click it in the preview to create it)
- Type \`[[\` in the editor to autocomplete note names
- Backlinks appear under the editor
- **Ctrl/Cmd+O** quick switcher · **Ctrl/Cmd+S** sync · **Alt+N** new note
- Use \`folder/name\` when creating a note to put it in a folder
- Set up sync with the ⚙ button

- [ ] Try a task item
`;
(async function init() {
  await DB.open();
  for (const n of await DB.all()) notes.set(n.path, n);
  if (!live().length) {
    const n = { path: 'Welcome.md', content: WELCOME, mtime: Date.now(), sha: null, dirty: true };
    notes.set(n.path, n); await DB.put(n);
  }
  rebuildIndex();
  const last = localStorage.getItem('vault.last');
  const start = (last && notes.has(last) && !notes.get(last).deleted) ? last : live().sort((a, b) => b.mtime - a.mtime)[0].path;
  setMode(localStorage.getItem('vault.mode') || 'split');
  await openNote(start);
  document.body.classList.remove('drawer');
  setStatus(getCfg() ? 'Sync configured' : 'Local only — set up sync in ⚙');
  if (getCfg()) sync();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
